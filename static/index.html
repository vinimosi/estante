<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estante</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e5a00d'/><rect x='14' y='14' width='10' height='36' rx='2' fill='%23111'/><rect x='27' y='14' width='10' height='36' rx='2' fill='%23111'/><rect x='41' y='16' width='10' height='34' rx='2' fill='%23111' transform='rotate(12 46 33)'/></svg>">
<style>
:root{
  --bg:#0f1115; --panel:#161920; --panel2:#1d2129; --line:#2a2f3a;
  --text:#e8e9ec; --muted:#9aa0ab; --dim:#6b717c;
  --accent:#e5a00d; --accent2:#f5b82e; --danger:#e5484d; --ok:#3dbb7a;
  --card:170px; --radius:10px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c313b;border-radius:10px;border:2px solid var(--bg)}

aside{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;font-weight:700;font-size:18px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand .logo svg{width:20px;height:20px}
.nav{padding:6px 10px;overflow-y:auto;flex:1}
.nav h4{margin:18px 10px 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.nav h4 button{background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:0 4px}
.nav h4 button:hover{color:var(--accent)}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--muted);font-size:14px}
.item:hover{background:var(--panel2);color:var(--text)}
.item.on{background:rgba(229,160,13,.12);color:var(--accent2)}
.item .ic{width:18px;text-align:center}
.item .n{margin-left:auto;font-size:12px;color:var(--dim)}
.item.on .n{color:var(--accent)}
.col-item{display:flex;align-items:center}
.col-item .item{flex:1;min-width:0}
.caret{width:18px;flex:none;background:none;border:0;color:var(--dim);font-size:11px;padding:0;transition:transform .12s;text-align:center}
.caret.aberta{transform:rotate(90deg)}
button.caret:hover{color:var(--accent)}
.empty-tags{padding:4px 10px;font-size:12.5px;color:var(--dim);line-height:1.45}
.side-foot{padding:12px;border-top:1px solid var(--line)}

main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 36px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;opacity:.5}
.spacer{flex:1}
select.sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.size{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.size input{accent-color:var(--accent);width:90px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#3a404c;background:#232833}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#16120a;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:#ff8a8d;border-color:#5a2a2c;background:#2a1719}
.btn.ghost{background:none}
.btn.on{border-color:var(--accent);color:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:230px;z-index:30;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px}
.menu button:hover{background:#2a2f3a}
.menu small{display:block;color:var(--dim);font-size:12px;margin-top:2px}

.content{flex:1;overflow-y:auto;padding:22px 26px 90px}
.head{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.head h1{margin:0;font-size:24px}
.head span{color:var(--dim);font-size:14px}
.row-title{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:4px 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card),1fr));gap:22px 18px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:var(--card);gap:18px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:28px}

.card{position:relative;cursor:pointer;outline:none}
.cover{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--panel2);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .bgb{display:none}
.cover.wide .bgb{display:block;position:absolute;inset:-12%;width:124%;height:124%;filter:blur(16px) brightness(.55) saturate(1.2)}
.cover.wide .main{position:relative;object-fit:contain}
.dev{color:var(--muted);font-size:14px;margin-bottom:4px}
.desc{color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line}
textarea.inp{resize:vertical;min-height:90px;font:inherit}
.preview{display:flex;gap:16px;margin-top:16px;background:var(--panel2);border-radius:12px;padding:14px}
.preview img{width:160px;border-radius:8px;object-fit:cover;align-self:flex-start;flex:none}
.preview h3{margin:0 0 4px;font-size:17px}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:14px}
.checks label{display:flex;align-items:center;gap:8px;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.pick-h{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:18px 0 10px;font-weight:600}
.ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ipick button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--bg);height:120px}
.ipick button:hover{border-color:#5a5f6a}
.ipick button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(229,160,13,.35)}
.ipick img{width:100%;height:100%;object-fit:cover;display:block}
.badge.upd{background:#3b82f6;color:#fff}
.infos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text)}
.pill.st-Completo{background:rgba(61,187,122,.18);color:#6ee7a8}
.pill.st-Abandonado{background:rgba(229,72,77,.18);color:#ff8a8d}
.pill.st-Pausado{background:rgba(229,160,13,.18);color:var(--accent2)}
.pill.st-Em{background:rgba(59,130,246,.18);color:#93c5fd}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.genres span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.upd-box{margin:0 26px 4px;padding:14px 16px;border-radius:12px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upd-box b{color:#93c5fd}
.upd-box .acts{margin-left:auto;display:flex;gap:8px}
.tag-itch{grid-column:2/4;color:#fa5c5c;font-size:12px}
.ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:14px 14px 40px;font-weight:700;font-size:17px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-3px);box-shadow:0 0 0 2px var(--accent),0 14px 28px rgba(0,0,0,.5)}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
.card:hover .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.play span:hover{background:var(--accent2);transform:scale(1.06)}
.play svg{width:22px;margin-left:3px}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600}
.badge.live{background:var(--ok);color:#06210f}
.badge.miss{background:var(--danger);color:#fff}
.fav{position:absolute;top:8px;right:8px;color:var(--accent2);filter:drop-shadow(0 1px 3px rgba(0,0,0,.8));font-size:16px}
.check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:none}
.selecting .check{display:block}
.card.picked .check{background:var(--accent);border-color:var(--accent)}
.card.picked .check::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #16120a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.card.picked .cover{box-shadow:0 0 0 3px var(--accent)}
.selecting .play{display:none}
.meta{padding:8px 2px 0}
.meta .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12px;color:var(--dim);margin-top:2px}

.blank{max-width:520px;margin:70px auto;text-align:center;color:var(--muted);line-height:1.6}
.blank h2{color:var(--text);margin:14px 0 8px}
.blank .big{font-size:54px}
.blank .acts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

.bulk{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:40;transition:transform .2s}
.bulk.show{transform:translateX(-50%) translateY(0)}
.bulk b{padding:0 8px;white-space:nowrap}

.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);z-index:51;transform:translateX(100%);transition:transform .25s;overflow-y:auto;border-left:1px solid var(--line)}
.drawer.show{transform:none}
.hero{position:relative;padding:26px 26px 22px;display:flex;gap:20px;overflow:hidden}
.hero .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) brightness(.4) saturate(1.3);z-index:0}
.hero>*:not(.bgimg){position:relative;z-index:1}
.hero .cover{width:150px;flex:none}
.hero h2{margin:4px 0 6px;font-size:24px;line-height:1.15}
.hero .yr{color:var(--muted);font-size:14px}
.hero .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.x{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.45);font-size:20px;line-height:1}
.x:hover{background:rgba(0,0,0,.7)}
.sec{padding:18px 26px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 12px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:12px}
.stat b{display:block;font-size:17px}
.stat small{color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip button{border:0;background:none;color:var(--dim);font-size:15px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--danger)}
.chips input{background:none;border:1px dashed var(--line);border-radius:999px;padding:5px 12px;outline:none;font-size:13px;min-width:190px}
.chips input:focus{border-color:var(--accent)}
.path{font-family:Consolas,monospace;font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:10px 12px;word-break:break-all}
.toggles{display:flex;gap:8px;flex-wrap:wrap}

.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-wrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(920px,100%)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:18px}
.modal header .x{position:static}
.modal .body{padding:20px 22px;overflow-y:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.modal footer .left{margin-right:auto;color:var(--dim);font-size:13px}
.abas{display:flex;gap:4px;margin:12px 22px 0;background:var(--bg);border-radius:10px;padding:4px;flex:none}
.abas button{flex:1;border:0;background:none;color:var(--muted);padding:8px 6px;border-radius:7px;font-size:13.5px;font-weight:600;white-space:nowrap}
.abas button:hover{color:var(--text)}
.abas button.on{background:var(--panel2);color:var(--accent2)}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
.inp:focus{border-color:var(--accent)}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}
.hint{font-size:13px;color:var(--dim);line-height:1.55}
.steps{margin:0 0 16px;padding-left:20px;color:var(--muted);line-height:1.7;font-size:14px}
.scan-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.scan-row{display:grid;grid-template-columns:24px 1fr 1.3fr;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px}
.scan-row.done{opacity:.5}
.scan-row input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.scan-row .inp{padding:7px 10px;background:var(--bg)}
.scan-row select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px}
.scan-row small{grid-column:2/4;color:var(--dim);font-size:12px}
.matches{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.match{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.match.on{border-color:var(--accent);color:var(--accent2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cgrid button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--panel2);aspect-ratio:2/3}
.cgrid button:hover{border-color:var(--accent)}
.cgrid img{width:100%;height:100%;object-fit:cover;display:block}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:24px auto}
@keyframes sp{to{transform:rotate(360deg)}}

.lojatag{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.72);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.wandtag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#5eead4;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.lojatag:has(~ .wandtag){max-width:calc(100% - 70px)}
.pill.wand{background:rgba(94,234,212,.14);color:#5eead4}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.item .dot{margin:0 5px}
.pill.loja{display:inline-flex;align-items:center;gap:6px}
.aviso{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:rgba(229,160,13,.10);border:1px solid rgba(229,160,13,.35);margin:0 0 22px;font-size:14px}
.aviso .acts{margin-left:auto;display:flex;gap:8px}
.grupo{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:12px}
.grupo .gs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gmini{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 12px 8px 8px;flex:1;min-width:220px}
.gmini .cover{width:44px;flex:none;box-shadow:none;border-radius:6px}
.gmini .ph{font-size:9px;padding:4px}
.gmini b{display:block;font-size:14px}
.gmini small{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
.gmini input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.fontes{display:flex;flex-direction:column;gap:8px}
.fonte{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.fonte .q{flex:1;min-width:100px}
.fonte .btn{padding:6px 10px;font-size:13px}
.fonte .q b{display:flex;align-items:center;gap:7px;font-size:14px}
.fonte .q small{color:var(--dim);font-size:12px}
.fonte .principal{font-size:11px;font-weight:700;color:var(--accent2);background:rgba(229,160,13,.14);border-radius:999px;padding:2px 8px}
.lojas-cfg{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.loja-row{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:8px;padding:9px 12px}
.loja-row .q{flex:1}
.loja-row .q b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.loja-row .q small{color:var(--dim);font-size:12px}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:#3a404c;transition:background .15s;cursor:pointer}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
.shelves{display:flex;gap:4px;margin:0 12px 4px;background:var(--bg);border-radius:10px;padding:4px}
.shelves button{flex:1;border:0;background:none;color:var(--muted);padding:8px 4px;border-radius:7px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.shelves button:hover{color:var(--text)}
.shelves button.on{background:var(--panel2);color:var(--accent2);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.badge.cnovo{background:#3b82f6;color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.card .ler-btn{margin-top:7px;width:100%;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.lista{display:flex;flex-direction:column;gap:6px;max-width:860px}
.lista .dia{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 4px;font-weight:600}
.lrow{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;cursor:pointer}
.lrow:hover{border-color:#3a404c}
.lrow .cover{width:46px;flex:none;border-radius:7px;box-shadow:none}

<script>
const S = {games: [], view: {type: 'all'}, q: '', sort: 'name', selecting: false, picked: new Set(), open: null, hasKey: false, keyHint: '', lastJson: '', pendingCollection: null, repetidos: []};
// de onde vem cada jogo ('' = jogo do seu PC, sem loja). Cores só para diferenciar, sem logos.
const LOJA = {
  steam: {n: 'Steam', c: '#66c0f4'}, epic: {n: 'Epic Games', curto: 'Epic', c: '#cfd3da'}, gog: {n: 'GOG', c: '#b46fe8'},
  ea: {n: 'EA app', curto: 'EA', c: '#ff5a5a'}, ubisoft: {n: 'Ubisoft Connect', curto: 'Ubisoft', c: '#4d8dff'},
  battlenet: {n: 'Battle.net', c: '#29a8ff'}, xbox: {n: 'Xbox', c: '#52b043'}, '': {n: 'Sem loja', c: '#e5a00d'}
};
const ORDEM_LOJAS = ['steam', 'epic', 'gog', 'ea', 'ubisoft', 'battlenet', 'xbox', ''];
const lojaDe = k => LOJA[k || ''] || LOJA[''];
const pela = k => (['steam', 'epic'].includes(k) ? 'pela ' : 'pelo ') + lojaDe(k).n;
const dot = k => `<span class="dot" style="background:${lojaDe(k).c}"></span>`;
const store = {
  get(k, d) { try { const v = localStorage.getItem('estante.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('estante.' + k, JSON.stringify(v)); } catch (e) {} }
};
// Escolhas que valem para a Estante toda ficam no config.json, para entrarem na cópia de segurança.
// O resto (estante aberta, ordem, coleções abertas...) é só desta janela e continua no store.
const PREFS_NOS_DADOS = ['leitorOnde', 'leitorAuto', 'leitorModo', 'leitorAjuste_r', 'leitorAjuste_p'];
const pref = {
  v: {},
  get(k, d) { return k in this.v ? this.v[k] : d; },
  set(k, v) { this.v[k] = v; api('/api/preferencias', {method: 'POST', body: {[k]: v}}).catch(() => {}); }
};
S.estante = store.get('estante', 'jogos') === 'leitura' ? 'leitura' : 'jogos';
S.sort = store.get(S.estante === 'leitura' ? 'sort_leitura' : 'sort', 'name');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsArg = s => esc(JSON.stringify(s));

async function api(url, opts = {}) {
  const o = {method: opts.method || 'GET', headers: {}};
  if (opts.body !== undefined) {
    if (opts.body instanceof FormData) o.body = opts.body;
    else { o.body = JSON.stringify(opts.body); o.headers['Content-Type'] = 'application/json'; }
  }
  const r = await fetch(url, o);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error) || 'Algo deu errado (' + r.status + ')');
  return data;
}
function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3500);
}

function fmtTime(sec) {
  sec = sec || 0;
  if (sec < 60) return sec ? 'Menos de 1 min' : 'Nunca jogado';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (!h) return m + ' min';
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
function fmtShort(sec) {
  if (!sec || sec < 60) return null;
  const h = sec / 3600;
  return h >= 1 ? (h >= 10 ? Math.round(h) : h.toFixed(1).replace('.', ',')) + ' h jogadas' : Math.round(sec / 60) + ' min jogados';
}
function fmtWhen(ts) {
  if (!ts) return 'Nunca';
  const d = new Date(ts * 1000);
  const diff = Math.round((new Date(new Date().toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Ontem';
  if (diff < 30) return 'Há ' + diff + ' dias';
  return d.toLocaleDateString('pt-BR', {day: '2-digit', month: 'short', year: 'numeric'});
}
function fitCover(img) { if (img.naturalWidth / img.naturalHeight > 0.8) img.parentElement.classList.add('wide'); }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function coverHTML(g) {
  if (g.cover_url) return `<img class="bgb" src="${esc(g.cover_url)}" alt=""><img class="main" src="${esc(g.cover_url)}" alt="" loading="lazy" onload="fitCover(this)">`;
  const h = hue(g.name);
  return `<div class="ph" style="background:linear-gradient(160deg,hsl(${h} 45% 32%),hsl(${(h + 40) % 360} 50% 14%))">${esc(g.name)}</div>`;
}

async function load() {
  if (S.estante === 'leitura') return loadLeitura();
  try {
    const res = await api('/api/games');
    const games = res.games;
    if (res.removed && res.removed.length) {
      const n = res.removed.length;
      toast(n === 1 ? '“' + res.removed[0] + '” saiu da estante porque o jogo não está mais na pasta.'
                    : n + ' jogos saíram da estante porque não estão mais nas pastas: ' + res.removed.join(', '));
      if (S.open && !games.some(g => g.id === S.open)) closeDrawer();
    }
    if (res.relinked && res.relinked.length) {
      const n = res.relinked.length;
      toast(n === 1 ? 'Versão nova de “' + res.relinked[0] + '” reconhecida. Tempo jogado, capa e coleções foram mantidos.'
                    : n + ' jogos com versão nova reconhecidos, com tempo jogado, capa e coleções mantidos.');
    }
    if (res.added && res.added.length) {
      const n = res.added.length;
      toast(n === 1 ? '“' + res.added[0] + '” entrou na estante.'
                    : n + ' jogos novos entraram na estante, vindos das suas lojas e pastas.');
      pollFor(Math.max(40, n * 3));
    }
    if (res.sairam && res.sairam.length) {
      const n = res.sairam.length;
      toast(n === 1 ? '“' + res.sairam[0] + '” foi desinstalado na loja e saiu da estante. Se instalar de novo, ele volta com o tempo jogado.'
                    : n + ' jogos desinstalados nas lojas saíram da estante. Se instalar de novo, eles voltam com o tempo jogado.');
      if (S.open && !games.some(g => g.id === S.open)) closeDrawer();
    }
    if (res.voltaram && res.voltaram.length) {
      const n = res.voltaram.length;
      toast(n === 1 ? '“' + res.voltaram[0] + '” foi instalado de novo e voltou com tempo jogado, capa e coleções.'
                    : n + ' jogos instalados de novo voltaram com tempo jogado, capa e coleções.');
    }
    if (res.convertidos && res.convertidos.length) {
      const n = res.convertidos.length;
      toast(n === 1 ? '“' + res.convertidos[0] + '” agora abre pela loja dele. Tempo jogado, capa e coleções foram mantidos.'
                    : n + ' jogos que você tinha adicionado à mão agora abrem pela loja deles, com tudo mantido.');
    }
    S.repetidos = res.repetidos || [];
    const j = JSON.stringify(games) + JSON.stringify(S.repetidos);
    if (j === S.lastJson) return;
    S.lastJson = j; S.games = games;
    render();
    if (S.open) {
      const a = document.activeElement;
      if (!(a && $('drawer').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderDrawer();
    }
  } catch (e) { console.error(e); }
}

const prefixos = t => t.split('/').map((_, i, a) => a.slice(0, i + 1).join('/'));
const naColecao = (g, c) => g.tags.some(t => t === c || t.startsWith(c + '/'));
function allTags() {

  S.games.forEach(g => { new Set(g.tags.flatMap(prefixos)).forEach(t => m.set(t, (m.get(t) || 0) + (g.hidden ? 0 : 1))); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'pt-BR', {numeric: true}));
}
const daPasta = c => S.games.some(g => g.colecao_pasta && (g.colecao_pasta === c || g.colecao_pasta.startsWith(c + '/')));
function colecoesHTML(tags) {
  const abertas = new Set(store.get('colAbertas', []));
  const filhos = c => tags.filter(([t]) => t.startsWith(c + '/') && !t.slice(c.length + 1).includes('/'));
  const item = ([t, n]) => {
    const subs = filhos(t), nivel = t.split('/').length - 1, aberta = abertas.has(t) || (S.view.type === 'tag' && S.view.tag.startsWith(t + '/'));
    const on = S.view.type === 'tag' && S.view.tag === t;
    return `<div class="col-item" style="padding-left:${nivel * 14}px">
      ${subs.length ? `<button class="caret${aberta ? ' aberta' : ''}" title="${aberta ? 'Fechar' : 'Abrir'}" onclick="togColecao(${jsArg(t)})">▸</button>` : '<span class="caret"></span>'}
      <button class="item${on ? ' on' : ''}" onclick="go('tag', ${jsArg(t)})" title="${esc(t)}${daPasta(t) ? ' · segue as pastas' : ''}"><span class="ic">${daPasta(t) ? '📁' : '▤'}</span>${esc(t.split('/').pop())}<span class="n">${n}</span></button></div>`
      + (subs.length && aberta ? subs.map(item).join('') : '');
  };
  return tags.filter(([t]) => !t.includes('/')).map(item).join('');
}
function togColecao(t) {
  const a = new Set(store.get('colAbertas', []));
  a.has(t) ? a.delete(t) : a.add(t);
  store.set('colAbertas', [...a]); renderNav();
}
function visible() {
  if (S.estante === 'leitura') return visibleLeitura();
  const v = S.view, q = S.q.trim().toLowerCase();
  let list = S.games.filter(g => {
    if (v.type === 'hidden') return g.hidden;
    if (g.hidden) return false;
    if (v.type === 'fav') return g.favorite;
    if (v.type === 'recent') return !!g.last_played;
    if (v.type === 'tag') return naColecao(g, v.tag);
    if (v.type === 'never') return !g.playtime;
    if (v.type === 'updates') return g.has_update;
    if (v.type === 'loja') return (g.lojas || ['']).includes(v.tag);
    if (v.type === 'wand') return !!g.wand;
    if (v.type === 'situacao') return (g.situacao || '') === v.tag;
    return true;
  });
  if (q) list = list.filter(g => g.name.toLowerCase().includes(q) || g.tags.some(t => t.toLowerCase().includes(q)) || (g.developer || '').toLowerCase().includes(q) || (g.engine || '').toLowerCase().includes(q) || (g.genres || []).some(x => x.toLowerCase().includes(q)) || (g.lojas || []).some(k => k && lojaDe(k).n.toLowerCase().includes(q)));
  const name = (a, b) => a.name.localeCompare(b.name, 'pt-BR', {numeric: true});
  const sort = v.type === 'recent' ? 'recent' : S.sort;
  const fn = {
    name,
    recent: (a, b) => (b.last_played || 0) - (a.last_played || 0) || name(a, b),
    time: (a, b) => (b.playtime || 0) - (a.playtime || 0) || name(a, b),
    added: (a, b) => (b.added || 0) - (a.added || 0),
    year: (a, b) => (a.year || 9999) - (b.year || 9999) || name(a, b),
  }[sort] || name;
  return list.sort(fn);
}

function navItem(type, label, icon, count, tag) {
  const on = S.view.type === type && (tag === undefined || S.view.tag === tag);
  const arg = tag !== undefined ? `'${type}', ${jsArg(tag)}` : `'${type}'`;
  return `<button class="item${on ? ' on' : ''}" onclick="go(${arg})"><span class="ic">${icon}</span>${esc(label)}<span class="n">${count}</span></button>`;

function renderNav() {
  if (S.estante === 'leitura') return renderNavLeitura();

    `<h4>Biblioteca</h4>` +

// a sua situação em cada jogo; a seção só aparece quando algum jogo tem uma
const SITUACOES = [['quero', 'Quero jogar', '☆'], ['jogando', 'Jogando', '▶'], ['zerei', 'Zerei', '✓'], ['larguei', 'Larguei', '✕']];
const situacaoNome = k => (SITUACOES.find(x => x[0] === k) || [])[1] || '';
function navSituacoes(shown) {
  const usadas = SITUACOES.filter(([k]) => shown.some(g => g.situacao === k));
  if (!usadas.length) return '';
  return `<h4>Sua situação</h4>` + usadas.map(([k, n, ic]) => navItem('situacao', n, ic, shown.filter(g => g.situacao === k).length, k)).join('');
}
function navLojas(shown) {
  const cont = k => shown.filter(g => (g.lojas || ['']).includes(k)).length;
  const comJogos = ORDEM_LOJAS.filter(k => cont(k));
  // só mostra o filtro quando há jogos de alguma loja (se tudo é "sem loja", não precisa)
  if (!comJogos.some(k => k)) return '';
  return `<h4>Lojas</h4>` + comJogos.map(k => navItem('loja', lojaDe(k).n, dot(k), cont(k), k)).join('');

function lojaTag(g) {
  const ls = (g.lojas || []).filter((k, i, a) => a.indexOf(k) === i);
  if (!ls.length || (ls.length === 1 && !ls[0])) return '';
  const k = ls[0] || ls[1];
  const extra = ls.length > 1 ? ' +' + (ls.length - 1) : '';
  return `<div class="lojatag" title="${esc(ls.map(x => lojaDe(x).n).join(', '))}">${dot(k)}${esc(lojaDe(k).curto || lojaDe(k).n)}${extra}</div>`;
}

function viewTitle() {

// estatísticas: desenha na hora com o que já veio e atualiza por trás, para não piscar a cada atualização da estante
const STATS = {};
async function renderStats() {
  renderNav();
  document.body.classList.remove('selecting');
  const em = S.estante;
  if (STATS[em]) desenharStats(em, STATS[em]);
  else $('content').innerHTML = `<div class="head"><h1>Estatísticas</h1></div><div class="spin"></div>`;
  let r; try { r = await api('/api/estatisticas?em=' + em); } catch (e) { if (!STATS[em]) $('content').innerHTML = `<div class="blank">${esc(e.message)}</div>`; return; }
  const mudou = JSON.stringify(r) !== JSON.stringify(STATS[em]);
  STATS[em] = r;
  if (mudou && S.view.type === 'stats' && S.estante === em) desenharStats(em, r);
}
function barrasHTML(semanas, fmt) {
  const max = Math.max(1, ...semanas.map(x => x.valor));
  return `<div class="barras">${semanas.map((x, i) => {
    const d = new Date(x.inicio * 1000), rot = i === semanas.length - 1 ? 'Esta' : d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
    return `<div class="barra" title="Semana de ${d.toLocaleDateString('pt-BR', {day: 'numeric', month: 'long'})}: ${esc(x.valor ? fmt(x.valor) : 'nada')}">
      <i style="height:${x.valor ? Math.max(3, x.valor / max * 100) : 0}%"></i><small>${rot}</small></div>`;
  }).join('')}</div>`;
}
function topHTML(itens, fmt) {
  const max = Math.max(1, ...itens.map(x => x.valor));
  return `<div class="topo">${itens.map(x => `<button onclick="openDrawer(${jsArg(x.id)})"><span class="nm">${esc(x.nome)}</span>
    <span class="tr"><i style="width:${x.valor / max * 100}%"></i></span><b>${esc(fmt(x.valor))}</b></button>`).join('')}</div>`;
}

      ${stat(r.comecadas + ' de ' + r.series, 'Séries começadas')}</div>

  } else {
    html += `<div class="stats">${stat(r.semana >= 60 ? fmtTime(r.semana) : 'Nada', 'Nos últimos 7 dias')}${stat(r.mes >= 60 ? fmtTime(r.mes) : 'Nada', 'Nos últimos 30 dias')}
      ${stat(fmtTime(r.total), 'Tempo jogado ao todo')}${stat(r.jogados + ' de ' + r.jogos, 'Jogos que você já jogou')}</div>

// ======================================================================= modo TV
// Capas grandes para ver de longe e usar com controle (Gamepad API do navegador, sem instalar nada).
// Direcional ou alavanca escolhem, A abre, B sai, X sorteia, LB/RB trocam de estante. No teclado: setas, Enter, Esc.
const TV = {aberto: false, i: 0, lista: [], cols: 1, antes: {}, repete: {}, quadro: 0};
function listaTV() {
  const l = S.view.type === 'stats' ? S.games.filter(x => !x.hidden) : visible();
  return l.length ? l : S.games.filter(x => !x.hidden);
}
function abrirTV() {
  TV.aberto = true; TV.lista = listaTV(); TV.i = 0;
  closeDrawer();
  $('tv').classList.add('show');
  try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  desenharTV();
  if (!TV.quadro) TV.quadro = requestAnimationFrame(lerControle);
}
function fecharTV() {
  TV.aberto = false; $('tv').classList.remove('show'); $('tv').innerHTML = '';
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
function infoTV(x) {
  if (S.estante === 'leitura') {
    const p = x.proximo_cap || {};
    return x.local ? 'No seu PC' : p.existe === false ? 'Em dia' + (x.lido_txt ? ' · cap. ' + capTxt(x.lido_txt) : '')
      : p.num ? (p.continuar ? 'Continuar o cap. ' : 'Ler o cap. ') + capTxt(p.num) : 'Ler';
  }
  return x.running ? '● Jogando agora' : x.playtime ? fmtTime(x.playtime) + ' jogados' : 'Nunca jogado';
}
function desenharTV() {
  const l = TV.lista, leit = S.estante === 'leitura';
  TV.i = Math.max(0, Math.min(TV.i, l.length - 1));
  $('tv').innerHTML = `<div class="tv-fundo" id="tvFundo"></div>
    <div class="tv-topo"><h1>${leit ? '📖 Leitura' : '🎮 Jogos'}</h1><div class="tv-info" id="tvInfo"></div>
      <div class="tv-dicas"><span><b>A</b> ${leit ? 'ler' : 'jogar'}</span><span><b>X</b> sortear</span><span><b>LB RB</b> trocar estante</span><span><b>B</b> sair</span></div>
      <button class="x" onclick="fecharTV()" title="Sair do modo TV (Esc)">×</button></div>
    <div class="tv-grade" id="tvGrade">${l.length ? l.map((x, i) => `<div class="tv-card" data-i="${i}" onclick="TV.i=${i};focoTV();abrirNaTV()">
      <div class="tv-capa" style="${x.cover_url ? `background-image:url('${esc(x.cover_url)}')` : `background:hsl(${hue(x.name)} 40% 28%)`}">${x.cover_url ? '' : `<span>${esc(x.name)}</span>`}</div></div>`).join('')
      : `<div class="tv-vazio">Nada para mostrar aqui.</div>`}</div>`;
  focoTV();
}
function focoTV() {
  const cards = [...document.querySelectorAll('#tvGrade .tv-card')];
  if (!cards.length) return;
  const topo = cards[0].offsetTop;
  TV.cols = Math.max(1, cards.filter(c => c.offsetTop === topo).length);
  cards.forEach((c, i) => c.classList.toggle('on', i === TV.i));
  const c = cards[TV.i]; c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  const x = TV.lista[TV.i];
  $('tvInfo').innerHTML = `<b>${esc(x.name)}</b><small>${esc(infoTV(x))}</small>`;
  $('tvFundo').style.backgroundImage = x.cover_url ? `url('${x.cover_url}')` : '';
}
function moverTV(dx, dy) {
  const n = TV.lista.length; if (!n) return;
  let i = TV.i + dx + dy * TV.cols;
  if (dy && (i < 0 || i >= n)) i = dy < 0 ? TV.i : Math.min(n - 1, TV.i + (n - TV.i > TV.cols ? TV.cols : n - 1 - TV.i));
  TV.i = Math.max(0, Math.min(n - 1, i)); focoTV();
}
function abrirNaTV() {
  const x = TV.lista[TV.i]; if (!x) return;
  if (S.estante === 'leitura') lerProximo(x.id); else if (!x.running) play(x.id);
}
function sortearTV() {
  const n = TV.lista.length; if (n < 2) return;
  let i; do { i = Math.floor(Math.random() * n); } while (i === TV.i);
  TV.i = i; focoTV();
}
async function trocarEstanteTV() {
  await trocarEstante(S.estante === 'leitura' ? 'jogos' : 'leitura');
  if (TV.aberto) { TV.lista = listaTV(); TV.i = 0; desenharTV(); }
}
function teclaTV(e) {
  const k = {ArrowLeft: () => moverTV(-1, 0), ArrowRight: () => moverTV(1, 0), ArrowUp: () => moverTV(0, -1), ArrowDown: () => moverTV(0, 1),
    Enter: abrirNaTV, ' ': abrirNaTV, Escape: fecharTV, Backspace: fecharTV, Tab: trocarEstanteTV}[e.key];
  if (k) { e.preventDefault(); k(); }
}
// controle: A=0, B=1, X=2, LB=4, RB=5, Start=9, direcional 12 a 15; alavanca esquerda nos eixos 0 e 1
function lerControle(agora) {
  TV.quadro = 0;
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  for (const p of pads) {
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed), ax = p.axes || [];
    const estado = {
      a: b(0), b: b(1), x: b(2), lb: b(4), rb: b(5), start: b(9),
      esq: b(14) || ax[0] < -0.6, dir: b(15) || ax[0] > 0.6, cima: b(12) || ax[1] < -0.6, baixo: b(13) || ax[1] > 0.6,
    };
    const antes = TV.antes[p.index] || {}, rep = TV.repete[p.index] = TV.repete[p.index] || {};
    const apertou = k => estado[k] && !antes[k];
    // segurar uma direção repete: primeiro espera 350 ms, depois anda a cada 120 ms
    const direcao = (k, f) => {
      if (!estado[k]) { delete rep[k]; return; }
      if (!antes[k]) { rep[k] = agora + 350; f(); } else if (agora >= rep[k]) { rep[k] = agora + 120; f(); }
    };
    if (!TV.aberto) {
      if (apertou('start') && document.visibilityState === 'visible') abrirTV();
    } else {
      direcao('esq', () => moverTV(-1, 0)); direcao('dir', () => moverTV(1, 0));
      direcao('cima', () => moverTV(0, -1)); direcao('baixo', () => moverTV(0, 1));
      if (apertou('a')) abrirNaTV();
      if (apertou('b') || apertou('start')) fecharTV();
      if (apertou('x')) sortearTV();
      if (apertou('lb') || apertou('rb')) trocarEstanteTV();
    }
    TV.antes[p.index] = estado;
  }
  // com o modo TV aberto, olha o controle a cada quadro; fechado, só fica esperando o Start
  if (TV.aberto) TV.quadro = requestAnimationFrame(lerControle);
  else if (pads.length) setTimeout(() => { if (!TV.quadro) TV.quadro = requestAnimationFrame(lerControle); }, 250);
}
window.addEventListener('gamepadconnected', () => { if (!TV.quadro) TV.quadro = requestAnimationFrame(lerControle); });

  $('cn').focus();

function renameCollection() {
  const old = S.view.tag;
  openModal(head('Renomear coleção') + `<div class="body"><label class="f"><span>Novo nome</span><input class="inp" id="rn" value="${esc(old)}"></label></div>
    <footer><button class="btn danger" style="margin-right:auto" id="rnDel">Apagar coleção</button><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="rnOk">Salvar</button></footer>`);
  $('rn').select();
  const run = async newName => {
    newName = newName ? newName.split('/').map(x => x.trim()).filter(Boolean).join('/') : null;
    for (const g of S.games.filter(g => naColecao(g, old))) {
      const tags = g.tags.flatMap(t => t === g.colecao_pasta ? [t]  // segue a pasta: muda quando a pasta mudar
        : t === old ? (newName ? [newName] : []) : t.startsWith(old + '/') ? (newName ? [newName + t.slice(old.length)] : []) : [t]);
      await patch(g.id, {tags: [...new Set(tags)]});
    }
    closeModal();
    if (daPasta(old)) toast('As coleções que seguem as pastas continuam com o nome da pasta. Para mudar, renomeie a pasta no Windows.');
    newName ? go('tag', newName) : go('all');
    load();
  };
  $('rnOk').onclick = () => { const n = $('rn').value.trim(); if (n && n !== old) run(n); else closeModal(); };
  $('rnDel').onclick = () => { if (confirm('Apagar a coleção “' + old + '”? Os jogos continuam na estante.')) run(null); };
  $('rn').onkeydown = e => { if (e.key === 'Enter') $('rnOk').click(); };
}

async function checkAll() {
  try {
    const r = await api('/api/check-updates', {method: 'POST'});
    if (!r.total) { toast('Nenhum jogo com página e versão salvas para verificar.'); return; }
    toast('Verificando ' + r.total + (r.total === 1 ? ' jogo…' : ' jogos… pode continuar usando a Estante.'));
    const antes = new Set(S.games.filter(g => g.has_update).map(g => g.id));
    const t = setInterval(async () => {
      const st = await api('/api/check-updates');
      if (st.ativo) return;
      clearInterval(t); S.lastJson = ''; await load();
      const novos = S.games.filter(g => g.has_update && !antes.has(g.id));
      toast(novos.length ? (novos.length === 1 ? 'Nova versão de ' + novos[0].name + '!' : novos.length + ' jogos com versão nova!') : 'Verificação concluída. Nada novo por enquanto.');
    }, 2000);
  } catch (e) { toast(e.message, true); }
}
// sorteio: um entre os que estão na tela agora (com a busca e o filtro escolhidos)
let ultimoSorteado = null;
function sortear() {
  let l = visible();
  if (l.length > 1) l = l.filter(x => x.id !== ultimoSorteado);  // não repete o mesmo seguido
  if (!l.length) return toast(S.estante === 'leitura' ? 'Nenhuma série na tela para sortear.' : 'Nenhum jogo na tela para sortear.', true);
  const x = l[Math.floor(Math.random() * l.length)];
  ultimoSorteado = x.id;
  openDrawer(x.id);
  toast('🎲 Que tal ' + (S.estante === 'leitura' ? 'ler' : 'jogar') + ' “' + x.name + '”?');
}

async function resetTime(id) {

async function removeGame(id) {

function openCovers(id) {
  const g = byId(id);
  openModal(head('Trocar capa') + `<div class="body">
    ${S.hasKey ? `<div class="inline"><input class="inp" id="cq" value="${esc(g.name)}"><button class="btn primary" onclick="coverSearch('${id}')">Buscar</button></div>
      <div id="cMatches" class="matches"></div><div id="cGrid"></div>`
      : `<p class="hint" style="margin-top:0">Para buscar capas na internet, coloque sua chave do SteamGridDB nas Configurações.</p><button class="btn" onclick="openSettings()">⚙ Abrir Configurações</button>`}
  </div><footer><div class="left">Ou use uma imagem sua, ou a da página do jogo</div>
    <button class="btn" onclick="openLink('${id}')">🔗 Pegar do link</button>
    <label class="btn">📁 Escolher imagem do PC<input type="file" accept="image/*" hidden onchange="uploadCover('${id}', this)"></label></footer>`, true);
  if (S.hasKey) { $('cq').onkeydown = e => { if (e.key === 'Enter') coverSearch(id); }; coverSearch(id); }
}
async function coverSearch(id) {
  $('cMatches').innerHTML = ''; $('cGrid').innerHTML = '<div class="spin"></div>';
  try {
    const res = await api('/api/cover-search?q=' + encodeURIComponent($('cq').value));
    if (!res.length) { $('cGrid').innerHTML = '<p class="hint">Não achei esse jogo. Tente outro nome (em inglês costuma funcionar melhor).</p>'; return; }
    $('cMatches').innerHTML = res.map((r, i) => `<button class="match${i ? '' : ' on'}" data-sg="${r.id}">${esc(r.name)}${r.year ? ' (' + r.year + ')' : ''}</button>`).join('');
    $('cMatches').onclick = e => { const b = e.target.closest('.match'); if (!b) return; $('cMatches').querySelectorAll('.match').forEach(x => x.classList.toggle('on', x === b)); coverOptions(id, b.dataset.sg); };
    coverOptions(id, res[0].id);
  } catch (e) { $('cGrid').innerHTML = `<p class="hint" style="color:#ff8a8d">${esc(e.message)}</p>`; }
}
async function coverOptions(id, sg) {
  $('cGrid').innerHTML = '<div class="spin"></div>';
  try {
    const opts = await api('/api/cover-options/' + sg);
    if (!opts.length) { $('cGrid').innerHTML = '<p class="hint">Esse resultado não tem capas. Tente outro da lista acima.</p>'; return; }
    $('cGrid').innerHTML = `<div class="cgrid">${opts.map(o => `<button data-url="${esc(o.url)}"><img src="${esc(o.thumb)}" loading="lazy" alt=""></button>`).join('')}</div>`;
    $('cGrid').onclick = async e => {
      const b = e.target.closest('button[data-url]'); if (!b) return;
      $('cGrid').innerHTML = '<div class="spin"></div>';
      try { await api(`/api/games/${id}/cover`, {method: 'POST', body: {url: b.dataset.url}}); closeModal(); S.lastJson = ''; await load(); toast('Capa trocada!'); }
      catch (err) { toast(err.message, true); coverOptions(id, sg); }
    };
  } catch (e) { $('cGrid').innerHTML = `<p class="hint" style="color:#ff8a8d">${esc(e.message)}</p>`; }
}
async function uploadCover(id, input) {
  const f = input.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try { await api(`/api/games/${id}/cover`, {method: 'POST', body: fd}); closeModal(); S.lastJson = ''; await load(); toast('Capa trocada!'); }
  catch (e) { toast(e.message, true); }
}

let linkMeta = null, linkReq = 0;
function openLink(id) {
  const g = byId(id);
  openModal(head('Buscar dados pelo link') + `<div class="body">
    <p class="hint" style="margin-top:0">Cole o link da página do jogo, como a do itch.io, do Game Jolt ou do site do criador. A Estante lê o nome, a descrição, o criador e a imagem de capa que a página mostra.</p>
    <div class="inline"><input class="inp" id="lUrl" value="${esc(g.url || '')}" placeholder="https://criador.itch.io/meu-jogo"><button class="btn primary" id="lGo">Buscar</button></div>
    <div id="lOut"></div>
  </div><footer id="lFoot" style="display:none"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="lApply">Usar estes dados</button></footer>`, true);
  const go = async () => {
    const url = $('lUrl').value.trim(); if (!url) return;
    const meu = ++linkReq; linkMeta = null;
    $('lOut').innerHTML = '<div class="spin"></div>'; $('lFoot').style.display = 'none';
    try {
      const m = await api('/api/page-preview', {method: 'POST', body: {url}});
      if (meu !== linkReq) return;
      linkMeta = m;
      const imgs = m.images || (m.image ? [m.image] : []);
      const prox = u => '/api/img?u=' + encodeURIComponent(u) + '&r=' + encodeURIComponent(m.url || '');
      $('lOut').innerHTML = `${m.warning ? `<p class="hint" style="color:#ffb35c;margin:14px 0 0">${esc(m.warning)}</p>` : ''}
        <div class="preview">${imgs.length ? `<img id="lImg" src="${esc(prox(m.image))}" alt="">` : ''}
        <div style="min-width:0;flex:1">
          <label class="f" style="margin-bottom:8px"><span>Nome</span><input class="inp" id="lTitle" value="${esc(m.title || '')}" placeholder="Nome do jogo"></label>
          ${m.developer ? `<div class="dev">por ${esc(m.developer)}</div>` : ''}
          ${infoPills(m)}
          ${(m.genres || []).length ? `<div class="hint" style="margin:4px 0 6px">${esc(m.genres.join(' · '))}</div>` : ''}
          <div class="desc" style="font-size:13px;max-height:160px;overflow:auto">${esc(m.description || 'A página não tem descrição.')}</div>
          <div class="checks">
            <label><input type="checkbox" id="lName" ${m.title && m.title !== g.name ? 'checked' : ''}>Usar este nome</label>
            <label><input type="checkbox" id="lCover" ${imgs.length ? 'checked' : 'disabled'}>Usar a imagem escolhida como capa</label>
            <label><input type="checkbox" id="lInfo" checked>Guardar descrição, criador, link${m.version ? ', versão' : ''}${(m.genres || []).length ? ' e gêneros' : ''}</label>
          </div></div></div>
        ${imgs.length > 1 ? `<div class="pick-h">Escolha a capa: imagens encontradas nesta página</div>
          <div class="ipick">${imgs.map(u => `<button data-u="${esc(u)}" class="${u === m.image ? 'on' : ''}" title="Usar esta"><img src="${esc(prox(u))}" loading="lazy" alt=""></button>`).join('')}</div>` : ''}
        ${imgs.length ? '' : '<p class="hint">Essa página não tem imagens que dê para usar. Você pode escolher uma imagem sua em Trocar capa.</p>'}`;
      const ip = $('lOut').querySelector('.ipick');
      if (ip) {
        ip.onclick = e => {
          const b = e.target.closest('button[data-u]'); if (!b) return;
          ip.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
          linkMeta.image = b.dataset.u; $('lImg').src = prox(b.dataset.u); $('lCover').checked = true;
        };
        ip.querySelectorAll('img').forEach(im => {
          im.onerror = () => im.parentElement.remove();
          im.onload = () => { if (im.naturalWidth < 80 || im.naturalHeight < 80) im.parentElement.remove(); };
        });
      }
      $('lTitle').oninput = () => { $('lName').checked = true; };
      $('lFoot').style.display = '';
    } catch (e) {
      if (meu !== linkReq) return;
      $('lFoot').style.display = 'none';
      $('lOut').innerHTML = `<p class="hint" style="color:#ff8a8d;margin-top:16px">${esc(e.message)}</p>`;
    }
  };
  $('lGo').onclick = go;
  $('lUrl').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('lApply').onclick = async () => {
    if (!linkMeta) return;
    $('lApply').disabled = true;
    linkMeta.title = $('lTitle').value.trim();
    try {
      await api(`/api/games/${id}/from-page`, {method: 'POST', body: {meta: linkMeta, use_name: $('lName').checked, use_cover: $('lCover').checked, use_info: $('lInfo').checked}});
      closeModal(); S.lastJson = ''; await load(); renderDrawer(); toast('Dados atualizados!');
    } catch (e) { toast(e.message, true); $('lApply').disabled = false; }
  };
  if (g.url) go(); else $('lUrl').focus();
}

async function loadLeitura() {
  if (!L.baixVisto) {  // a Estante abriu com um download em andamento: volta a acompanhar
    L.baixVisto = true;
    api('/api/leitura/baixando').then(r => { if (r.ativo) acompanharBaixando(); }, () => {});
  }
  if (!L.sites.length && !L.sitesPedidos) {  // as regras dos sites (para o botão de procurar na busca de um site)
    L.sitesPedidos = true;
    api('/api/leitura/sites').then(ss => { L.sites = ss.sites || []; L.preferido = ss.preferido || ''; if (S.estante === 'leitura') render(); }, () => {});
  }
  try {
    const r = await api('/api/leitura' + (S.lastJson ? '?marca=' + S.lastJson : ''));  // sem mudança, vem só {igual: true}
    if (S.estante !== 'leitura' || r.igual) return;
    L.novidades = r.novidades || []; L.historico = r.historico || []; L.verificando = r.verificando; L.extensaoVista = r.extensao_vista;
    Object.assign(L, {extensaoVelha: r.extensao_velha, extensaoVersao: r.extensao_versao, extensaoPasta: r.extensao_pasta, navegador: r.navegador});
    if (L.carregou && Date.now() > (L.semAviso || 0)) {
      const novas = r.series.filter(s => !S.games.some(g => g.id === s.id));
      if (novas.length) toast(novas.length === 1 ? '“' + novas[0].name + '” entrou na sua Leitura.' : novas.length + ' séries novas entraram na sua Leitura.');
    }
    if (r.marca === S.lastJson) return;
    S.lastJson = r.marca; S.games = r.series; L.carregou = true;
    if (S.open && !byId(S.open)) closeDrawer();
    render();
    if (S.open) {
      const a = document.activeElement;
      if (!(a && $('drawer').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderDrawer();
    }
  } catch (e) { console.error(e); }
}

const sitesDe = s => s.local ? ['local'] : ((ks => ks.length ? ks : [''])((s.sites_info || []).map(x => x.site).filter(k => k !== 'local')));
const nomeNaLista = k => !k ? 'Sem site' : k === 'local' ? 'No seu PC'
  : (S.games.flatMap(s => s.sites_info || []).find(x => x.site === k) || {}).nome || siteNome(k);

function visibleLeitura() {
  const v = S.view, q = S.q.trim().toLowerCase();
  let list = S.games.filter(s => {
    if (v.type === 'hidden') return s.hidden;
    if (s.hidden) return false;
    if (v.type === 'fav') return s.favorite;
    if (v.type === 'novos') return s.tem_novo;
    if (v.type === 'recent') return !!s.ultima_leitura;
    if (v.type === 'tag') return s.tags.includes(v.tag);
    if (v.type === 'site') return sitesDe(s).includes(v.tag);
    if (v.type === 'lista') return s.lista_anilist === v.tag;
    return true;
  });
  list = list.filter(passaFiltros);
  if (q) list = list.filter(s => [s.name, s.autor, s.site_nome, ...(s.titulos_alt || []), ...(s.genres || []), ...s.tags].some(x => (x || '').toLowerCase().includes(q)));
  const name = (a, b) => a.name.localeCompare(b.name, 'pt-BR', {numeric: true});
  const fn = {
    name,
    recent: (a, b) => (b.ultima_leitura || 0) - (a.ultima_leitura || 0) || name(a, b),
    novos: (a, b) => (b.tem_novo ? b.nao_lidos : 0) - (a.tem_novo ? a.nao_lidos : 0) || (b.ultima_leitura || 0) - (a.ultima_leitura || 0),
    added: (a, b) => (b.added || 0) - (a.added || 0),
  }[v.type === 'recent' ? 'recent' : S.sort] || name;
  return list.sort(fn);
}

  const shown = S.games.filter(s => !s.hidden);
  const tags = allTags();
  const semana = Date.now() / 1000 - 7 * 86400;

  const listas = [...new Set(shown.map(s => s.lista_anilist).filter(Boolean))];

    navItem('all', 'Biblioteca', '▦', shown.length) +

    navItem('historico', 'Histórico', '◷', '') +
    navItem('stats', 'Estatísticas', '▥', '') +
    navItem('novos', 'Com capítulo novo', '●', shown.filter(s => s.tem_novo).length) +
    navItem('fav', 'Favoritos', '★', shown.filter(s => s.favorite).length) +
    navItem('hidden', 'Ocultos', '◐', S.games.filter(s => s.hidden).length) +

      sitesUsados.sort((a, b) => !a - !b || nomeNaLista(a).localeCompare(nomeNaLista(b)))

    (listas.length ? `<h4>Sua lista</h4>` + listas.map(l => navItem('lista', l, '☰', shown.filter(s => s.lista_anilist === l).length, l)).join('') : '') +

      : `<div class="empty-tags">Nenhuma coleção ainda. Clique no ＋ ou use “Selecionar” para juntar várias séries de uma vez.</div>`);
  $('tagList').innerHTML = tags.map(([t]) => `<option value="${esc(t)}">`).join('');
}

// filtros da Leitura no estilo do Comix: tipo, gênero e (por último) demografia
const TIPOS = ['Mangá', 'Manhwa', 'Manhua', 'Outros'];
const DEMOS = {shounen: 'Shounen', shonen: 'Shounen', shoujo: 'Shoujo', shojo: 'Shoujo', seinen: 'Seinen', josei: 'Josei'};
L.filtro = Object.assign({tiposFora: [], generos: [], demo: []}, store.get('filtroLeitura', {}));
const tipoDe = s => TIPOS.includes(s.tipo) ? s.tipo : 'Outros';
const demosDe = s => [...new Set((s.genres || []).map(g => DEMOS[g.trim().toLowerCase()]).filter(Boolean))];
const generosDe = s => (s.genres || []).map(g => g.trim()).filter(g => g && !DEMOS[g.toLowerCase()]);
function passaFiltros(s) {
  const f = L.filtro;
  if (f.tiposFora.includes(tipoDe(s))) return false;
  if (f.generos.length) { const gs = generosDe(s).map(g => g.toLowerCase()); if (!f.generos.every(g => gs.includes(g.toLowerCase()))) return false; }
  if (f.demo.length && !demosDe(s).some(d => f.demo.includes(d))) return false;
  return true;
}
const filtrosAtivos = () => L.filtro.tiposFora.length + L.filtro.generos.length + L.filtro.demo.length;
function salvarFiltro() { store.set('filtroLeitura', L.filtro); S.picked.clear(); render(); }
function togTipo(t) { const f = L.filtro.tiposFora; L.filtro.tiposFora = f.includes(t) ? f.filter(x => x !== t) : [...f, t]; salvarFiltro(); }
function togGenero(g) { const f = L.filtro.generos; L.filtro.generos = f.includes(g) ? f.filter(x => x !== g) : [...f, g]; salvarFiltro(); }
function togDemo(d) { const f = L.filtro.demo; L.filtro.demo = f.includes(d) ? f.filter(x => x !== d) : [...f, d]; salvarFiltro(); }
function limparFiltros() { L.filtro = {tiposFora: [], generos: [], demo: []}; salvarFiltro(); }
function filtrosHTML(base) {
  const conta = (lista, fn) => { const m = new Map(); base.forEach(s => fn(s).forEach(x => m.set(x, (m.get(x) || 0) + 1))); return m; };
  const tipos = conta(TIPOS, s => [tipoDe(s)]);
  const gens = [...conta(null, generosDe).entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR'));
  const demos = conta(null, demosDe);
  const muitos = !L.generosTodos && gens.length > 24;
  const mostrar = muitos ? gens.slice(0, 24).concat(gens.slice(24).filter(([g]) => L.filtro.generos.includes(g))) : gens;
  const chip = (txt, on, fn, n, fora) => `<button class="fchip${on ? ' on' : ''}${fora ? ' fora' : ''}" onclick="${fn}"><i>${on ? '✓' : ''}</i>${esc(txt)}${n != null ? ` <small>${n}</small>` : ''}</button>`;
  return `<div class="filtros">
    <h5>Tipos</h5><div class="fchips">${TIPOS.map(t => chip(t, !L.filtro.tiposFora.includes(t), `togTipo(${esc(JSON.stringify(t))})`, tipos.get(t) || 0, L.filtro.tiposFora.includes(t))).join('')}</div>
    ${gens.length ? `<h5>Gêneros ${L.filtro.generos.length ? '<span style="text-transform:none;letter-spacing:0">(com todos os marcados)</span>' : ''} ${gens.length > 24 ? `<button onclick="L.generosTodos=${muitos};render()">${muitos ? 'ver todos os ' + gens.length : 'ver menos'}</button>` : ''}</h5>
      <div class="fchips">${mostrar.map(([g, n]) => chip(g, L.filtro.generos.includes(g), `togGenero(${esc(JSON.stringify(g))})`, n)).join('')}</div>` : ''}
    ${demos.size ? `<h5>Demografia</h5><div class="fchips">${['Shounen', 'Shoujo', 'Seinen', 'Josei'].filter(d => demos.get(d)).map(d => chip(d, L.filtro.demo.includes(d), `togDemo('${d}')`, demos.get(d))).join('')}</div>` : ''}
    ${filtrosAtivos() ? `<div style="margin-top:12px"><button class="btn ghost sm" onclick="limparFiltros()">Limpar filtros</button></div>` : ''}
  </div>`;
}
function subSerie(s) {
  const p = s.proximo_cap || {};
  if (p.continuar) return 'Lendo o cap. ' + capTxt(p.num) + (s.disp_txt && s.disp_txt !== p.num ? ' de ' + capTxt(s.disp_txt) : '') + (p.pct ? ' · ' + p.pct + '% lido' : '');
  if (s.lido_txt) return 'Cap. ' + capTxt(s.lido_txt) + (s.disp_txt && s.disp_txt !== s.lido_txt ? ' de ' + capTxt(s.disp_txt) : '');
  return s.disp_txt ? capTxt(s.disp_txt) + ' capítulos · não começada' : 'Não começada';
}
function cardSerie(s, comBotao) {
  const p = s.proximo_cap || {};
  return `<div class="card${S.picked.has(s.id) ? ' picked' : ''}" tabindex="0" data-id="${s.id}">
    <div class="cover">${coverHTML(s)}
      ${s.tem_novo ? `<div class="badge cnovo" title="Capítulos que saíram depois do último que você leu">${s.nao_lidos} ${s.nao_lidos === 1 ? 'NOVO' : 'NOVOS'}</div>` : ''}
      ${s.favorite && !S.selecting ? '<div class="fav">★</div>' : ''}
      ${s.site_principal ? `<div class="lojatag">${dotSite(s.site_principal)}${esc(s.site_nome || s.site_principal)}</div>` : ''}
      <div class="check"></div>
      <div class="play"><span data-ler="${s.id}" title="${p.existe === false ? 'Você está em dia' : 'Ler capítulo ' + esc(capTxt(p.num))}"><svg viewBox="0 0 24 24" fill="#16120a"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H10c1.1 0 2 .9 2 2v13c0-.8-.7-1.5-1.5-1.5h-5C4.7 17.5 4 16.8 4 16V5.5Zm16 0c0-.8-.7-1.5-1.5-1.5H14c-1.1 0-2 .9-2 2v13c0-.8.7-1.5 1.5-1.5h5c.8 0 1.5-.7 1.5-1.5V5.5Z"/></svg></span></div>
    </div>
    <div class="meta"><div class="t" title="${esc(s.name)}">${esc(s.name)}</div><div class="s">${esc(subSerie(s))}</div>
      ${comBotao ? (p.existe === false ? `<button class="btn sm ler-btn" disabled>✓ Em dia</button>` : `<button class="btn primary sm ler-btn" data-ler="${s.id}" title="${p.continuar ? 'Você parou no meio deste capítulo' : ''}">${p.continuar ? 'Continuar' : 'Ler'} capítulo ${esc(capTxt(p.num))}</button>`) : ''}</div>
  </div>`;
}

function diaDe(ts) {
  const d = new Date(ts * 1000);
  const diff = Math.round((new Date(new Date().toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Ontem';
  return d.toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'});
}
const hora = ts => new Date(ts * 1000).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
function linhaHTML(s, texto, quando, botao) {
  return `<div class="lrow" data-abrir="${s.id}"><div class="cover">${coverHTML(s)}</div>
    <div class="q"><b>${esc(s.name)}</b><small>${texto}</small></div><span class="when">${quando}</span>${botao || ''}</div>`;
}
function listaPorDia(itens, linha) {
  let html = '<div class="lista">', dia = '';
  for (const it of itens) {
    const d = diaDe(it.t);
    if (d !== dia) { html += `<div class="dia">${esc(d)}</div>`; dia = d; }
    html += linha(it);
  }
  return html + '</div>';
}

  renderNav();
  document.body.classList.toggle('selecting', S.selecting);
  const v = S.view;

  if (!S.games.length) {
    html = `<div class="blank"><div class="big">📖</div><h2>Sua Leitura está vazia</h2>
      A Estante guarda onde você parou em cada mangá, manhwa ou HQ que você lê nos sites, e avisa quando sai capítulo novo. A leitura continua nos sites.
      <br><br>O jeito mais fácil é instalar a extensão do navegador: depois disso, é só ler normalmente que tudo aparece aqui sozinho.
      <div class="acts"><button class="btn primary" onclick="openExtensao()">🧩 Instalar a extensão</button>
      <button class="btn" onclick="openImportar()">⇩ Importar sua lista</button><button class="btn" onclick="openColar()">🔗 Colar link de capítulo</button></div></div>`;

      (itens.length ? listaPorDia(itens, n => linhaHTML(n.s, 'Capítulo ' + esc(capTxt(n.c)) + (n.site ? ' · saiu primeiro no ' + esc(siteNome(n.site)) : '') + (n.s.ultimo_lido != null && n.c <= n.s.ultimo_lido ? ' · <span style="color:var(--ok)">lido</span>' : ''), hora(n.t),
        `<button class="btn sm" data-lercap="${n.s.id}" data-n="${n.c}">Ler</button>`))
        : `<div class="blank"><div class="big">✦</div>Nenhum capítulo novo por enquanto.<br><span class="hint">A Estante procura capítulos novos a cada 6 horas, no MangaUpdates e nas páginas de série que você abre nos sites.</span></div>`);
  } else if (v.type === 'historico') {

    });
    html = `<div class="head"><h1>Histórico</h1><span>o que você leu, do mais recente</span></div>` +

        : `<div class="blank"><div class="big">◷</div>Nada lido ainda.<br><span class="hint">Com a extensão instalada, cada capítulo que você abre aparece aqui.</span></div>`);
  } else {
    const list = visible();
    const titulos = {all: 'Biblioteca', fav: 'Favoritos', novos: 'Com capítulo novo', hidden: 'Ocultos', recent: 'Lidas recentemente'};
    const tit = v.type === 'site' ? nomeNaLista(v.tag) : titulos[v.type] || v.tag;
    html += `<div class="head"><h1>${esc(tit)}</h1><span>${list.length} ${list.length === 1 ? 'série' : 'séries'}</span>
      <button class="btn${filtrosAtivos() ? ' on' : ''}" style="align-self:center" onclick="L.filtrosAbertos=!L.filtrosAbertos;render()">⚲ Filtros${filtrosAtivos() ? ' (' + filtrosAtivos() + ')' : ''}</button>
      ${v.type === 'tag' ? `<button class="btn ghost" style="margin-left:auto" onclick="renameCollection()">Renomear coleção</button>` : ''}
      ${v.type === 'novos' ? `<button class="btn" style="margin-left:auto" id="verBtn" onclick="verificarLeitura()">${L.verificando && L.verificando.ativo ? 'Procurando…' : '⟳ Procurar capítulos novos'}</button>` : ''}
      ${v.type === 'site' && !v.tag && siteComBusca() && list.length ? `<button class="btn" style="margin-left:auto" id="procurarBtn" onclick="procurarNoSite()" title="A extensão procura cada série na busca do site, devagar, e liga só quando um único resultado tem o mesmo nome">🔗 Procurar no ${esc(siteComBusca().nome)}</button>` : ''}</div>`;
    if (L.filtrosAbertos) html += filtrosHTML(S.games.filter(s => v.type === 'hidden' ? s.hidden : !s.hidden));
    if (v.type === 'all' && !S.q && !S.selecting && !L.extensaoVista) {

      const cont = S.games.filter(s => !s.hidden && s.ultima_leitura).sort((a, b) => b.ultima_leitura - a.ultima_leitura).slice(0, 8);
      if (cont.length) html += `<div class="row-title">Continue lendo</div><div class="strip">${cont.map(s => cardSerie(s, true)).join('')}</div><div class="row-title">Biblioteca</div>`;

// os capítulos abrem na janela de leitura da Estante (uma janela só do site, sem barra de endereço)
// onde abrir os capítulos: na própria janela da Estante (com a barra da extensão e o botão de voltar),
// numa janela de leitura separada, ou no navegador normal
// a Estante foi atualizada, mas o navegador ainda usa a extensão antiga
function avisoExtensaoVelha() {
  const nav = L.navegador === 'chrome' ? 'chrome://extensions' : 'edge://extensions';
  return `<div class="aviso"><span>🧩</span><div>A extensão do navegador está desatualizada${L.extensaoVersao ? ' (versão ' + esc(L.extensaoVersao) + ')' : ''}. A Estante já tem a versão ${esc(L.extensaoPasta)}. Abra <b>${nav}</b> no navegador e clique em <b>Recarregar</b> na extensão “Estante - Leitura”.</div></div>`;
}
function ondeAbrir() { return pref.get('leitorOnde', L.extensaoVista ? 'mesma' : 'janela'); }
async function abrirSite(url) {
  const onde = ondeAbrir();
  if (onde === 'mesma') {
    try { sessionStorage.setItem('estante.voltar', JSON.stringify({estante: S.estante, view: S.view, open: S.open, scroll: $('content').scrollTop})); } catch (e) {}
    window.__lendoAqui = true;  // não é para fechar a Estante: você só foi ler e vai voltar
    location.href = url;
    return;
  }
  if (onde === 'janela') {
    try { await api('/api/abrir-leitor', {method: 'POST', body: {url}}); return; } catch (e) { /* abre no navegador */ }
  }
  window.open(url, '_blank', 'noopener');
}
// voltando do site pelo botão "← Estante": reabre onde você estava
async function restaurarVolta() {
  let v = null;
  try { v = JSON.parse(sessionStorage.getItem('estante.voltar') || 'null'); sessionStorage.removeItem('estante.voltar'); } catch (e) {}
  if (!v || v.estante !== S.estante) return;
  S.view = v.view || {type: 'all'}; S.lastJson = ''; await load();
  if (v.open && byId(v.open)) openDrawer(v.open);
  setTimeout(() => { $('content').scrollTop = v.scroll || 0; }, 50);
}
function lerProximo(id) {
  const s = byId(id); if (!s) return;
  if (s.local) {
    if (s.local.proximo == null) { toast('Você leu todos os capítulos de “' + s.name + '” que estão no seu PC.'); return; }
    abrirLocal(id, s.local.proximo); return;
  }
  const p = s.proximo_cap || {};
  if (p.existe === false) {
    toast('Você está em dia com “' + s.name + '”. Quando sair o capítulo ' + capTxt(p.num) + ', ele aparece em Novidades.');
    return;
  }
  if (p.url) { abrirSite(p.url); toast((p.continuar ? 'Continuando o capítulo ' : 'Abrindo o capítulo ') + capTxt(p.num) + ' de “' + s.name + '”' + (p.site_nome ? ' no ' + p.site_nome : '') + '…'); return; }
  if (s.url_lido) { abrirSite(s.url_lido); toast('Abrindo o capítulo ' + capTxt(s.lido_txt) + ', onde você parou. É só ir para o próximo.'); return; }
  if (s.url_serie) { abrirSite(s.url_serie); toast('Abrindo a página da série no site: escolha o capítulo ' + capTxt(p.num) + ' lá.'); return; }
  toast('Ainda não sei em que site você lê “' + s.name + '”. Abra um capítulo dela no site (com a extensão) ou cole o link em “Onde você lê”, no painel da série.', true);
  openDrawer(id);
}
function urlCap(s, n) {
  const k = String(parseFloat(n));
  return (s.capitulos || {})[k] || (s.modelo_url ? s.modelo_url.replace('{n}', k) : '');
}
function lerCap(id, n) {
  const s = byId(id); if (!s) return;
  if (s.local) { abrirLocal(id, s.local.caps.findIndex(c => c.n === parseFloat(n))); return; }
  const u = urlCap(s, n);
  if (u) { abrirSite(u); return; }
  if (s.url_serie) { abrirSite(s.url_serie); toast('Abrindo a página da série: escolha o capítulo ' + capTxt(n) + ' lá.'); return; }
  toast('Não sei o link desse capítulo. Abra a série no site pela extensão ou cole o link de um capítulo.', true);
}

function capitulosHTML(s) {
  if (s.local) {
    const lido = s.ultimo_lido, caps = s.local.caps, todos = L.todosCaps === s.id, lista = [...caps.keys()].reverse();
    const mostrar = todos ? lista : lista.slice(0, 40);
    return `<div class="caps">${mostrar.map(k => {
      const c = caps[k], ok = lido != null && c.n <= lido, pg = (s.local.paginas || {})[String(c.n)];
      return `<div class="cap${ok ? ' lido' : ''}${k === s.local.proximo ? ' atual' : ''}">
        <button class="lnk" onclick="abrirLocal('${s.id}', ${k})">Capítulo ${capTxt(c.n)} <span class="hint" style="font-size:12px">· ${esc(c.nome)}${c.tipo === 'pdf' ? ' (PDF)' : ''}${!ok && pg ? ' · parou na página ' + (pg + 1) : ''}</span>${k === s.local.proximo ? ' <span class="tagc">· próximo</span>' : ''}</button>
        <button class="ck" onclick="marcarCap(${c.n})" title="${ok ? 'Marcar como não lido' : 'Marcar como lido (até aqui)'}">${ok ? '✓' : ''}</button></div>`;
    }).join('')}</div>${lista.length > mostrar.length ? `<button class="btn ghost" style="margin-top:8px" onclick="L.todosCaps='${s.id}';renderDrawer()">Mostrar todos os ${lista.length} capítulos</button>` : ''}`;
  }
  const nums = new Set(Object.keys(s.capitulos || {}).map(Number).filter(n => !isNaN(n)));
  const disp = parseFloat(s.disp_txt) || 0;
  if (disp && disp <= 5000) for (let i = 1; i <= Math.floor(disp); i++) nums.add(i);
  if (s.ultimo_lido != null) nums.add(s.ultimo_lido);
  const lista = [...nums].sort((a, b) => b - a);
  if (!lista.length) return '<p class="hint" style="margin:0">A lista aparece quando a Estante descobrir até onde a série já foi (pelo MangaUpdates ou ao abrir a página da série no site).</p>';
  const todos = L.todosCaps === s.id;
  const lido = s.ultimo_lido;
  const prox = parseFloat((s.proximo_cap || {}).num);
  const mostrar = todos ? lista : lista.slice(0, 40);
  return `<div class="caps">${mostrar.map(n => {
    const ok = lido != null && n <= lido;
    return `<div class="cap${ok ? ' lido' : ''}${n === prox ? ' atual' : ''}">
      <button class="lnk" onclick="lerCap('${s.id}', ${n})" title="Abrir no site">Capítulo ${capTxt(n)} ${n === prox ? `<span class="tagc">· ${(s.proximo_cap || {}).continuar ? 'lendo' + ((s.proximo_cap || {}).pct ? ' ' + s.proximo_cap.pct + '%' : '') : 'próximo'}</span>` : ''}${(s.primeiro_site || {})[String(n)] && (s.sites_info || []).length > 1 ? ` <span class="hint" style="font-size:11.5px">· saiu primeiro no ${esc(s.primeiro_site[String(n)])}</span>` : ''}</button>
      <button class="ck" onclick="marcarCap(${n})" title="${ok ? 'Marcar como não lido' : 'Marcar como lido (até aqui)'}">${ok ? '✓' : ''}</button></div>`;
  }).join('')}</div>
  ${lista.length > mostrar.length ? `<button class="btn ghost" style="margin-top:8px" onclick="L.todosCaps='${s.id}';renderDrawer()">Mostrar todos os ${lista.length} capítulos</button>` : ''}`;
}
async function marcarCap(n) {
  const s = byId(S.open);
  const lido = s.ultimo_lido;
  let novo = n;
  if (lido != null && n <= lido) {
    const nums = Object.keys(s.capitulos || {}).map(Number).filter(x => x < n);
    novo = nums.length ? Math.max(...nums) : (n - 1 >= 1 ? n - 1 : null);
    if (n > 1 && Number.isInteger(n) && (novo === null || novo < n - 1)) novo = n - 1;
  }
  try { await patch(s.id, {ultimo_lido: novo}); S.lastJson = ''; await load(); }
  catch (e) { toast(e.message, true); }
}

async function tirarSite(k) {

async function verificarSerie(id) {
  const b = $('chkBtn'); if (b) { b.disabled = true; b.textContent = 'Procurando…'; }
  try {
    const r = await api(`/api/leitura/${id}/verificar`, {method: 'POST'});
    S.lastJson = ''; await load();
    toast(!r.achou ? 'Não achei essa série no MangaUpdates. Use “Buscar dados no MangaUpdates” para escolher a série certa.'
      : r.serie.tem_novo ? r.serie.nao_lidos + (r.serie.nao_lidos === 1 ? ' capítulo novo!' : ' capítulos novos!') : 'Você está em dia: o último capítulo é o ' + capTxt(r.serie.disp_txt) + '.');
  } catch (e) { toast(e.message, true); }
  renderDrawer();
}
async function verificarLeitura() {
  try {
    const r = await api('/api/leitura/verificar', {method: 'POST'});
    if (!r.total) { toast('Nenhuma série em andamento para verificar.'); return; }
    toast('Procurando capítulos novos de ' + r.total + (r.total === 1 ? ' série…' : ' séries… pode continuar usando a Estante.'));
    L.verificando = r; render();
    const antes = new Set(S.games.filter(s => s.tem_novo).map(s => s.id));
    const t = setInterval(async () => {
      const st = await api('/api/leitura/verificar');
      if (st.ativo) return;
      clearInterval(t); S.lastJson = ''; await load();
      const novos = S.games.filter(s => s.tem_novo && !antes.has(s.id));
      toast(novos.length ? (novos.length === 1 ? 'Capítulo novo de ' + novos[0].name + '!' : novos.length + ' séries com capítulo novo!') : 'Verificação concluída. Nada novo por enquanto.');
    }, 2500);
  } catch (e) { toast(e.message, true); }
}
async function atualizarDoMu(id) {
  const b = $('muDeNovo'); if (b) { b.disabled = true; b.textContent = 'Buscando…'; }
  try {
    const s = await api(`/api/leitura/${id}/atualizar-mu`, {method: 'POST'});
    const i = S.games.findIndex(x => x.id === id); if (i >= 0) S.games[i] = s;
    S.lastJson = ''; render(); renderDrawer(); toast('Dados da série atualizados pelo MangaUpdates.');
  } catch (e) { toast(e.message, true); if (b) { b.disabled = false; b.textContent = '⟳ Buscar de novo no MangaUpdates'; } }
}
async function atualizarTodasDoMu() {
  const n = S.games.filter(s => s.mu_id).length;
  if (!n) return toast('Nenhuma série ligada ao MangaUpdates.', true);
  if (!confirm(`Buscar de novo no MangaUpdates os dados de ${n} série${n > 1 ? 's' : ''}? Vai devagar, uma a cada 2 segundos (uns ${Math.max(1, Math.round(n * 2.3 / 60))} minutos), e você pode continuar usando a Estante. O nome, a capa escolhida por você e o capítulo lido não mudam.`)) return;
  try {
    await api('/api/leitura/atualizar-mu', {method: 'POST'});
    acompanharAtualizacaoMu();
  } catch (e) { toast(e.message, true); }
}
async function acompanharAtualizacaoMu() {
  let st; try { st = await api('/api/leitura/atualizar-mu'); } catch (e) { return; }
  const el = $('muTodas');
  if (el) el.textContent = st.ativo ? `Buscando… ${st.feitos} de ${st.total}` : '⟳ Buscar de novo os dados de todas';
  if (el) el.disabled = !!st.ativo;
  if (st.ativo) return setTimeout(acompanharAtualizacaoMu, 3000);
  if (st.total) { S.lastJson = ''; await load(); toast(`Dados de ${st.feitos - st.erros} série${st.feitos - st.erros === 1 ? '' : 's'} atualizados pelo MangaUpdates.` + (st.erros ? ` ${st.erros} não responderam.` : '')); }
}

            toast('“' + n.name + '” entrou na sua Leitura.');

          L.semAviso = Date.now() + 4000; closeModal(); S.lastJson = ''; await load(); pollFor(20);
        } catch (e) { toast(e.message, true); go(); }
      });
    } catch (e) { $('aRes').innerHTML = `<p class="hint" style="color:#ff8a8d">${esc(e.message)}</p>`; }
  };
  $('aGo').onclick = go;
  $('aq').onkeydown = e => { if (e.key === 'Enter') go(); };
  if (s) go(); else $('aq').focus();
}

    ${up.recusadas.length ? `<details class="mu-recusadas" style="margin-bottom:8px"><summary>${up.recusadas.length === 1 ? '1 série foi recusada' : up.recusadas.length + ' séries foram recusadas'} pelo MangaUpdates</summary>

async function ligarTocando(ligado) {
  try { await api('/api/tocando/config', {method: 'POST', body: {ligado}}); lerTocando(); }
  catch (e) { toast(e.message, true); }
}
async function salvarGenius() {
  const k = ($('gIn').value || '').trim(); if (!k) return;
  try { const r = await api('/api/tocando/config', {method: 'POST', body: {genius_key: k}}); toast(r.aviso || 'Chave do Genius salva e funcionando!'); openSettings(); }
  catch (e) { toast(e.message, true); }
}
async function tirarGenius() {
  try { await api('/api/tocando/config', {method: 'POST', body: {tirar_genius: true}}); toast('A chave do Genius saiu.'); openSettings(); }
  catch (e) { toast(e.message, true); }
}

let fastUntil = 0;
function pollFor(sec) { fastUntil = Date.now() + sec * 1000; }
setInterval(() => { if (!document.hidden && (Date.now() < fastUntil || S.games.some(g => g.running))) load(); }, 2500);
setInterval(async () => {
  if (document.hidden) return;
  try {
    if (S.estante === 'leitura') return;
    const r = await api('/api/running');
    const now = S.games.filter(g => g.running).map(g => g.id).sort();
    if (JSON.stringify(r) !== JSON.stringify(now)) { S.lastJson = ''; load(); }
  } catch (e) {}
}, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
// avisa o programa que a janela está aberta; quando ela fecha, a Estante se fecha sozinha
const ping = () => fetch('/api/ping', {method: 'POST'}).catch(() => {});
ping(); setInterval(ping, 15000);
window.addEventListener('pagehide', () => { if (window.__lendoAqui) return; try { navigator.sendBeacon('/api/bye'); } catch (e) {} });
// verifica se algum jogo saiu da pasta a cada minuto
setInterval(() => { if (!document.hidden) load(); }, 60000);

aplicarEstante();
setInterval(() => { if (!document.hidden && S.estante === 'leitura') load(); }, 8000);  // capítulos que a extensão acabou de registrar
loadCfg().then(() => { if (S.boasVindas) openBoasVindas(); }).then(load).then(restaurarVolta).then(() => api('/api/sync', {method: 'POST'}).then(() => { S.lastJson = ''; load(); }).catch(() => {}));
</script>
